</div>

<div class="gap-3 mb-5 flex justify-center">

<button class="flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface transition-all duration-150 active:scale-[0.98] shadow-sm w-full" type="button">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>

</svg>
<span class="font-body-md text-body-md font-medium text-sm">Google</span>
</button>

<!-- Divider -->
<div class="relative flex items-center justify-center mb-5">

</div>
<!-- Form Container -->
<form class="space-y-3.5" onsubmit="event.preventDefault();">
<!-- Full Name (Account creation specific) -->
<div class="space-y-1 hidden" id="field-fullname">
<label class="block font-body-sm text-body-sm text-on-surface-variant font-medium" for="fullname">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px] pointer-events-none">person</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline text-body-md font-body-md pl-10 pr-3 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="fullname" placeholder="Alex Vance" type="text">
</div>
</div>
<!-- Handle Input (Account creation specific) -->
<div class="space-y-1 hidden" id="field-handle">
<div class="flex justify-between items-center">
<label class="block font-body-sm text-body-sm text-on-surface-variant font-medium" for="handle">Developer Handle</label>
<span class="font-label-sm text-label-sm text-secondary font-medium">available</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px] pointer-events-none">alternate_email</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline font-label-md text-label-md pl-10 pr-3 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="handle" placeholder="alex_dev" type="text" value="alex_dev">
</div>
</div>
<!-- Email Input -->
<div class="space-y-1">

<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px] pointer-events-none">mail</span>
<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline text-body-md font-body-md pl-10 pr-3 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="email" placeholder="alex@acme.corp" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<div class="flex justify-between items-center">

</div>
<div class="relative flex items-center">

<input class="w-full bg-surface-container-lowest/80 text-on-surface placeholder:text-outline text-body-md font-body-md pl-10 pr-10 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="password" placeholder="••••••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility()" type="button">

</button>

<div class="h-1 flex-1 rounded-full bg-secondary-container"></div>
<div class="h-1 flex-1 rounded-full bg-secondary-container"></div>

</div>

<!-- Submit Action -->

<span id="submit-text" class="">Sign In to Workspace</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Guest / Demo Link -->
<div class="mt-4 pt-3 flex flex-col items-center space-y-3">

</button>
<!-- Trust Security Badge -->

</div>
</div>

<script>
  function switchAuthMode(mode) {
    const isSignUp = mode === 'signup';
    const tabSignUp = document.getElementById('tab-signup');
    const tabSignIn = document.getElementById('tab-signin');
    const fullNameField = document.getElementById('field-fullname');
    const handleField = document.getElementById('field-handle');
    const meterField = document.getElementById('password-meter');
    const forgotLink = document.getElementById('forgot-link');
    const modalTitle = document.getElementById('modal-title');
    const submitText = document.getElementById('submit-text');

    if (isSignUp) {
      tabSignUp.className = 'flex-1 py-2 text-center rounded-lg font-body-md text-body-md font-medium bg-primary-container text-white shadow-md transition-all duration-200';
      tabSignUp.setAttribute('aria-selected', 'true');
      tabSignIn.className = 'flex-1 py-2 text-center rounded-lg font-body-md text-body-md font-medium text-on-surface-variant transition-all duration-200 hover:text-on-surface';
      tabSignIn.setAttribute('aria-selected', 'false');

      fullNameField.classList.remove('hidden');
      handleField.classList.remove('hidden');
      meterField.classList.remove('hidden');
      forgotLink.classList.add('hidden');

      modalTitle.textContent = 'Access Engineer Workspaces';
      submitText.textContent = 'Create Developer Account';
    } else {
      tabSignIn.className = 'flex-1 py-2 text-center rounded-lg font-body-md text-body-md font-medium bg-primary-container text-white shadow-md transition-all duration-200';
      tabSignIn.setAttribute('aria-selected', 'true');
      tabSignUp.className = 'flex-1 py-2 text-center rounded-lg font-body-md text-body-md font-medium text-on-surface-variant transition-all duration-200 hover:text-on-surface';
      tabSignUp.setAttribute('aria-selected', 'false');

      fullNameField.classList.add('hidden');
      handleField.classList.add('hidden');
      meterField.classList.add('hidden');
      forgotLink.classList.remove('hidden');

      modalTitle.textContent = 'Welcome Back, Engineer';
      submitText.textContent = 'Sign In to Workspace';
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }
</script></main>
